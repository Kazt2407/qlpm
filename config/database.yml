default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: <%= ENV.fetch("DB_TIMEOUT", 5000) %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= ENV.fetch("DB_USERNAME", "qlpm") %>
  password: <%= ENV.fetch("DB_PASSWORD", "qlpm") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "qlpm") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "qlpm_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "qlpm") %>
