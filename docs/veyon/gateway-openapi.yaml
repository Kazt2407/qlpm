openapi: 3.0.3
info:
  title: QLPM Veyon Gateway API
  version: 1.0.0
  description: Internal API between Rails QLPM and Veyon Gateway.
servers:
  - url: http://veyon-gateway:8088
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    OpenConnectionRequest:
      type: object
      required: [host, auth_method]
      properties:
        host:
          type: string
          description: Target Windows client endpoint as host:service_port. In QLPM this is built from veyon_hosts.host and veyon_hosts.service_port, usually port 11100.
          example: lab-a-pc-01.school.local:11100
        auth_method:
          type: string
          enum: [auth_keys, auth_logon, auth_simple, auth_ldap]
        credentials:
          type: object
          additionalProperties: true
    OpenConnectionResponse:
      type: object
      required: [connection_uid, valid_until]
      properties:
        connection_uid:
          type: string
        valid_until:
          type: string
          format: date-time
    FeatureRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        arguments:
          type: object
          additionalProperties: true
    FeatureResponse:
      type: object
      properties:
        success:
          type: boolean
        upstream_code:
          type: integer
        upstream_message:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
paths:
  /v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/connections/open:
    post:
      summary: Open or reuse authenticated connection to host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenConnectionRequest'
      responses:
        '200':
          description: Connection opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenConnectionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/connections/{connection_uid}:
    delete:
      summary: Close connection
      parameters:
        - in: path
          name: connection_uid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Closed
        '404':
          description: Not found
  /v1/hosts/{host}/framebuffer:
    get:
      summary: Get host framebuffer image through an authenticated connection
      parameters:
        - in: path
          name: host
          required: true
          description: URL-encoded Windows client endpoint, usually host:11100.
          schema:
            type: string
        - in: query
          name: format
          schema:
            type: string
            enum: [jpeg, png]
            default: jpeg
        - in: query
          name: quality
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
        - in: query
          name: width
          schema:
            type: integer
            minimum: 64
            maximum: 1920
            default: 360
        - in: query
          name: height
          schema:
            type: integer
            minimum: 64
            maximum: 1080
      responses:
        '200':
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '503':
          description: Framebuffer unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hosts/{host}/features/{feature_key}:
    post:
      summary: Execute Veyon feature on host
      parameters:
        - in: path
          name: host
          required: true
          description: URL-encoded Windows client endpoint, usually host:11100.
          schema:
            type: string
        - in: path
          name: feature_key
          required: true
          schema:
            type: string
            enum:
              - screen_lock
              - input_devices_lock
              - user_logoff
              - reboot
              - power_down
              - text_message
              - open_website
              - start_app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureRequest'
      responses:
        '200':
          description: Feature execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureResponse'
        '400':
          description: Invalid request or feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hosts/{host}/user:
    get:
      summary: Get current logged-on user info from host
      parameters:
        - in: path
          name: host
          required: true
          description: URL-encoded Windows client endpoint, usually host:11100.
          schema:
            type: string
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  login:
                    type: string
                  full_name:
                    type: string
  /v1/hosts/{host}/session:
    get:
      summary: Get session info from host
      parameters:
        - in: path
          name: host
          required: true
          description: URL-encoded Windows client endpoint, usually host:11100.
          schema:
            type: string
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: integer
                  session_uptime_seconds:
                    type: integer
                  session_client_address:
                    type: string
                  session_client_name:
                    type: string
                  session_host_name:
                    type: string
